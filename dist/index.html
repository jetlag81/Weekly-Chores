<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Chores & Household Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      @media print {
        @page {
          size: letter landscape;
          margin: 0.22in 0.28in;
        }

        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        html, body, #root, #app-container {
          height: auto !important;
          min-height: 0 !important;
          background: #ffffff !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        header,
        #__code-inspector-ui,
        .no-print,
        .print\:hidden {
          display: none !important;
        }

        main {
          max-width: 100% !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        #printable-schedule-card {
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          overflow: visible !important;
        }

        #printable-schedule-card .overflow-x-auto {
          overflow: visible !important;
        }

        #printable-schedule-table {
          width: 100% !important;
          table-layout: fixed !important;
          border-collapse: collapse !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          font-size: 10.5px !important;
          line-height: 1.15 !important;
        }

        #printable-schedule-table tr {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          page-break-after: avoid !important;
          page-break-before: avoid !important;
        }

        #printable-schedule-table th,
        #printable-schedule-table td {
          position: static !important;
          vertical-align: middle !important;
        }

        /* Top Title & Header */
        #printable-schedule-table thead tr:first-child th {
          height: 34px !important;
          padding-top: 5px !important;
          padding-bottom: 5px !important;
          padding-left: 10px !important;
          font-size: 17px !important;
          line-height: 1.2 !important;
        }

        #printable-schedule-table thead tr:nth-child(2) th {
          height: 46px !important;
          vertical-align: middle !important;
        }

        #printable-schedule-table thead tr:nth-child(2) th div {
          line-height: 1.15 !important;
        }

        #printable-schedule-table thead tr:nth-child(3) th {
          height: 18px !important;
          padding-top: 2px !important;
          padding-bottom: 2px !important;
          font-size: 9px !important;
        }

        /* Section Headers */
        #printable-schedule-table tr.section-header-row,
        #printable-schedule-table tr.section-header-row td {
          height: 28px !important;
          min-height: 28px !important;
          padding-top: 3px !important;
          padding-bottom: 3px !important;
          padding-left: 8px !important;
          padding-right: 8px !important;
          font-size: 12px !important;
        }

        /* Spacious & Uniform Chore Rows */
        #printable-schedule-table tr.chore-row {
          height: 42px !important;
          min-height: 42px !important;
        }

        #printable-schedule-table tr.chore-row td {
          height: 42px !important;
          padding-top: 4px !important;
          padding-bottom: 4px !important;
          padding-left: 4px !important;
          padding-right: 4px !important;
          vertical-align: middle !important;
          font-size: 10.5px !important;
        }

        #printable-schedule-table tr.chore-row td select {
          font-size: 11px !important;
          font-weight: 600 !important;
        }

        /* 7-Day Color Band */
        #printable-schedule-table tr.h-14,
        #printable-schedule-table tr.color-band-row {
          height: 22px !important;
          min-height: 22px !important;
          max-height: 22px !important;
        }

        /* Weekly Sign-Off Row */
        #printable-schedule-table tr.sign-off-row,
        #printable-schedule-table tr.sign-off-row td {
          height: 34px !important;
          min-height: 34px !important;
          padding-top: 4px !important;
          padding-bottom: 4px !important;
          vertical-align: middle !important;
          font-size: 11px !important;
        }

        #printable-schedule-table button {
          min-height: 0 !important;
          height: auto !important;
          padding-top: 0 !important;
          padding-bottom: 0 !important;
        }

        /* Clean up interactive controls when printing so it looks like a printed sheet */
        #printable-schedule-table select {
          appearance: none !important;
          -webkit-appearance: none !important;
          -moz-appearance: none !important;
          border: none !important;
          background: transparent !important;
          box-shadow: none !important;
          padding: 0 !important;
          text-align: center !important;
          text-align-last: center !important;
          font-size: inherit !important;
          height: auto !important;
        }
      }
    </style>
