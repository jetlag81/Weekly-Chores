<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#13111C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chores Hub" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Weekly Chores & Household Hub</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('PWA ServiceWorker registered with scope:', reg.scope);
          }).catch(err => {
            console.warn('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      };
      // Zero-flash Theme & Palette Initializer (Dark + Midnight Plum & Coral Default)
      (function() {
        try {
          var stored = localStorage.getItem('weekly_chores_theme_mode_v1');
          var isLight = stored === 'light' || (stored === 'system' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isLight) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var palette = localStorage.getItem('weekly_chores_color_palette_v1') || 'plum-coral';
          document.documentElement.dataset.palette = palette;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.palette = 'plum-coral';
        }
      })();
    </script>
    <style>
      :root {
        --hub-canvas: #13111C;
        --hub-surface: #1C1829;
        --hub-elevated: #262138;
        --hub-border: #332B4A;
        --hub-accent: #F43F5E;
        --hub-accent-hover: #FB7185;
        --hub-secondary: #22D3EE;
      }

      html.dark[data-palette="plum-coral"] {
        --hub-canvas: #13111C;
        --hub-surface: #1C1829;
        --hub-elevated: #262138;
        --hub-border: #342C4C;
        --hub-accent: #F43F5E;
        --hub-accent-hover: #FB7185;
        --hub-secondary: #22D3EE;
      }

      html.dark[data-palette="warm-terracotta"] {
        --hub-canvas: #121417;
        --hub-surface: #1B1E23;
        --hub-elevated: #252930;
        --hub-border: #343A44;
        --hub-accent: #E07A5F;
        --hub-accent-hover: #EC8F76;
        --hub-secondary: #14B8A6;
      }

      html.dark[data-palette="deep-forest"] {
        --hub-canvas: #0D1514;
        --hub-surface: #13201E;
        --hub-elevated: #1C2E2B;
        --hub-border: #28423E;
        --hub-accent: #10B981;
        --hub-accent-hover: #34D399;
        --hub-secondary: #F59E0B;
      }

      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        max-width: 100vw;
        box-sizing: border-box;
        font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      h1, h2, h3, h4 {
        font-family: 'Plus Jakarta Sans', 'DM Sans', system-ui, sans-serif;
        letter-spacing: -0.015em;
      }

      body {
        background-color: var(--hub-canvas);
        padding: 0;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }

      html.dark {
        color-scheme: dark;
      }

      html:not(.dark) {
        color-scheme: light;
      }

      html:not(.dark) body {
        background-color: #F8FAFC;
      }

      /* Signature Household Palette Overrides (active for plum-coral, warm-terracotta, deep-forest) */
      @media screen {
        html.dark:not([data-palette="classic-slate"]) .dark\:bg-slate-950,
        html.dark:not([data-palette="classic-slate"]) .bg-slate-950 {
          background-color: var(--hub-canvas) !important;
        }
        html.dark:not([data-palette="classic-slate"]) .dark\:bg-slate-900,
        html.dark:not([data-palette="classic-slate"]) .bg-slate-900 {
          background-color: var(--hub-surface) !important;
        }
        html.dark:not([data-palette="classic-slate"]) .dark\:bg-slate-800,
        html.dark:not([data-palette="classic-slate"]) .bg-slate-800 {
          background-color: var(--hub-elevated) !important;
        }
        html.dark:not([data-palette="classic-slate"]) .dark\:border-slate-800,
        html.dark:not([data-palette="classic-slate"]) .border-slate-800,
        html.dark:not([data-palette="classic-slate"]) .dark\:border-slate-700,
        html.dark:not([data-palette="classic-slate"]) .border-slate-700 {
          border-color: var(--hub-border) !important;
        }
        html.dark:not([data-palette="classic-slate"]) .bg-indigo-600,
        html.dark:not([data-palette="classic-slate"]) .dark\:bg-indigo-600 {
          background-color: var(--hub-accent) !important;
        }
        html.dark:not([data-palette="classic-slate"]) .hover\:bg-indigo-500:hover,
        html.dark:not([data-palette="classic-slate"]) .hover\:bg-indigo-700:hover,
        html.dark:not([data-palette="classic-slate"]) .dark\:hover\:bg-indigo-500:hover {
          background-color: var(--hub-accent-hover) !important;
        }
        html.dark:not([data-palette="classic-slate"]) .text-indigo-300,
        html.dark:not([data-palette="classic-slate"]) .dark\:text-indigo-300,
        html.dark:not([data-palette="classic-slate"]) .text-indigo-400,
        html.dark:not([data-palette="classic-slate"]) .dark\:text-indigo-400 {
          color: var(--hub-secondary) !important;
        }
      }

      .modal-safe-area {
        padding-top: max(0.75rem, calc(0.75rem + max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)))) !important;
        padding-bottom: max(0.75rem, calc(0.75rem + max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)))) !important;
      }
      .drawer-safe-header {
        padding-top: max(0.875rem, calc(0.875rem + max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)))) !important;
      }
      .drawer-safe-footer {
        padding-bottom: max(0.875rem, calc(0.875rem + max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)))) !important;
      }

      @media print {
        @page {
          size: letter landscape;
          margin: 0.22in 0.28in;
        }

        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        html, body, #root, #app-container {
          color-scheme: light !important;
          height: auto !important;
          min-height: 0 !important;
          background: #ffffff !important;
          color: #0f172a !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        /* Always print the Weekly Chore Schedule in classic crisp white-paper format, even when Dark Mode is enabled */
        #printable-schedule-card {
          background: #ffffff !important;
          color: #0f172a !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          overflow: visible !important;
        }

        #printable-schedule-table {
          background: #ffffff !important;
          color: #0f172a !important;
        }

        #printable-schedule-table thead tr:nth-child(2) th:first-child,
        #printable-schedule-table thead tr:nth-child(2) th:first-child > div:first-child,
        #printable-schedule-table thead tr:nth-child(3),
        #printable-schedule-table thead tr:nth-child(3) th {
          background-color: #ffffff !important;
          color: #0f172a !important;
        }

        #printable-schedule-table thead tr:nth-child(3) th svg {
          color: #0f172a !important;
        }

        #printable-schedule-table tr.chore-row,
        #printable-schedule-table tr.chore-row td,
        #printable-schedule-table tr.sign-off-row,
        #printable-schedule-table tr.sign-off-row td {
          background-color: #ffffff !important;
          color: #0f172a !important;
        }

        #printable-schedule-table tr.chore-row td *,
        #printable-schedule-table tr.sign-off-row td * {
          color: #0f172a !important;
        }

        #printable-schedule-table tr.chore-row td button,
        #printable-schedule-table tr.sign-off-row td button {
          background-color: transparent !important;
          border-color: #cbd5e1 !important;
        }

        #printable-schedule-table tr.section-header-row,
        #printable-schedule-table tr.section-header-row td {
          background-color: #002060 !important;
          color: #ffffff !important;
        }

        header,
        #__code-inspector-ui,
        .no-print,
        .print\:hidden {
          display: none !important;
        }

        main {
          max-width: 100% !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        #printable-schedule-card .overflow-x-auto {
          overflow: visible !important;
        }

        #printable-schedule-table {
          width: 100% !important;
          table-layout: fixed !important;
          border-collapse: collapse !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          font-size: 10.5px !important;
          line-height: 1.15 !important;
        }

        #printable-schedule-table tr {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          page-break-after: avoid !important;
          page-break-before: avoid !important;
        }

        #printable-schedule-table th,
        #printable-schedule-table td {
          position: static !important;
          vertical-align: middle !important;
        }

        /* Top Title & Header */
        #printable-schedule-table thead tr:first-child {
          border-bottom: 2px solid #ffffff !important;
        }

        #printable-schedule-table thead tr:first-child th {
          height: 34px !important;
          padding-top: 5px !important;
          padding-bottom: 5px !important;
          padding-left: 10px !important;
          font-size: 17px !important;
          line-height: 1.2 !important;
        }

        #printable-schedule-table thead tr:nth-child(2) th {
          height: 46px !important;
          vertical-align: middle !important;
        }

        #printable-schedule-table thead tr:nth-child(2) th div {
          line-height: 1.15 !important;
        }

        #printable-schedule-table thead tr:nth-child(3) th {
          height: 18px !important;
          padding-top: 2px !important;
          padding-bottom: 2px !important;
          font-size: 9px !important;
        }

        /* Section Headers */
        #printable-schedule-table tr.section-header-row,
        #printable-schedule-table tr.section-header-row td {
          height: 28px !important;
          min-height: 28px !important;
          padding-top: 3px !important;
          padding-bottom: 3px !important;
          padding-left: 8px !important;
          padding-right: 8px !important;
          font-size: 12px !important;
        }

        /* Spacious & Uniform Chore Rows */
        #printable-schedule-table tr.chore-row {
          height: 42px !important;
          min-height: 42px !important;
        }

        #printable-schedule-table tr.chore-row td {
          height: 42px !important;
          padding-top: 4px !important;
          padding-bottom: 4px !important;
          padding-left: 4px !important;
          padding-right: 4px !important;
          vertical-align: middle !important;
          font-size: 10.5px !important;
        }

        #printable-schedule-table tr.chore-row td select {
          font-size: 11px !important;
          font-weight: 600 !important;
        }

        /* 7-Day Color Band */
        #printable-schedule-table tr.h-14,
        #printable-schedule-table tr.color-band-row {
          height: 22px !important;
          min-height: 22px !important;
          max-height: 22px !important;
        }

        /* Weekly Sign-Off Row */
        #printable-schedule-table tr.sign-off-row,
        #printable-schedule-table tr.sign-off-row td {
          height: 34px !important;
          min-height: 34px !important;
          padding-top: 4px !important;
          padding-bottom: 4px !important;
          vertical-align: middle !important;
          font-size: 11px !important;
        }

        #printable-schedule-table button {
          min-height: 0 !important;
          height: auto !important;
          padding-top: 0 !important;
          padding-bottom: 0 !important;
        }

        /* Clean up interactive controls when printing so it looks like a printed sheet */
        #printable-schedule-table select {
          appearance: none !important;
          -webkit-appearance: none !important;
          -moz-appearance: none !important;
          border: none !important;
          background: transparent !important;
          box-shadow: none !important;
          padding: 0 !important;
          text-align: center !important;
          text-align-last: center !important;
          font-size: inherit !important;
          height: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
