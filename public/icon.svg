<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002060" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Card -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="#FFFFFF" opacity="0.96" filter="url(#shadow)" />

  <!-- Clipboard Top Clip -->
  <rect x="186" y="58" width="140" height="48" rx="14" fill="#002060" />
  <rect x="216" y="72" width="80" height="18" rx="9" fill="#F8FAFC" />

  <!-- Checklist Lines -->
  <!-- Item 1: Checked -->
  <circle cx="132" cy="170" r="18" fill="#10B981" />
  <path d="M123 170l6 6 14-14" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="168" y="160" width="220" height="20" rx="10" fill="#E2E8F0" />

  <!-- Item 2: Checked -->
  <circle cx="132" cy="236" r="18" fill="#10B981" />
  <path d="M123 236l6 6 14-14" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="168" y="226" width="180" height="20" rx="10" fill="#E2E8F0" />

  <!-- Item 3: Active / Pending -->
  <circle cx="132" cy="302" r="18" fill="none" stroke="#CBD5E1" stroke-width="4" />
  <rect x="168" y="292" width="200" height="20" rx="10" fill="#CBD5E1" opacity="0.7" />

  <!-- Sparkle Star (Kid Incentive Trophy) -->
  <path d="M375 320l8 18 19 3-14 13 4 19-17-9-17 9 4-19-14-13 19-3z" fill="url(#goldGrad)" filter="url(#shadow)" />
</svg>

